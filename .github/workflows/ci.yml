name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORGE_TEST_DATABASE_URL: postgresql://forge:forge@127.0.0.1:5432/forge_test
      FORGE_DATABASE_URL: postgresql://forge:forge@127.0.0.1:5432/forge_test
      FORGE_MIGRATIONS_PATH: db/migrations
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: >-
          python -m pip install
          -e packages/agent-core
          -e packages/repo-intelligence
          -e services/api
          -e services/sandbox-controller
          -e services/worker
      - run: node scripts/validate-scaffold.mjs
      - run: python scripts/run-python-tests.py
      - run: pnpm web:typecheck
      - run: pnpm web:build
