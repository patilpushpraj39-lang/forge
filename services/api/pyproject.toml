[project]
name = "forge-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "forge-agent-core==0.0.0",
  "forge-publisher==0.0.0",
  "forge-sandbox-controller==0.0.0",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_api"]
