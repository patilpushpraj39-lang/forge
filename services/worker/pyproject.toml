[project]
name = "forge-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "forge-agent-core==0.0.0",
  "forge-evaluation==0.0.0",
  "forge-sandbox-controller==0.0.0",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_worker"]
