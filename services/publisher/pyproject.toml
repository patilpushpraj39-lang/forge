[project]
name = "forge-publisher"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<47",
  "forge-agent-core==0.0.0",
  "forge-evaluation==0.0.0",
  "forge-sandbox-controller==0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_publisher"]
