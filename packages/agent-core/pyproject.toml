[project]
name = "forge-agent-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_agent_core"]
