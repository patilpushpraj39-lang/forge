[project]
name = "forge-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Forge Python workspace metadata"

[tool.uv.workspace]
members = [
  "services/api",
  "services/sandbox-controller",
  "services/worker",
  "services/publisher",
  "packages/agent-core",
  "packages/repo-intelligence",
  "packages/evaluation",
  "packages/telemetry",
]

[tool.uv.sources]
forge-agent-core = { workspace = true }
forge-evaluation = { workspace = true }
forge-sandbox-controller = { workspace = true }
forge-repo-intelligence = { workspace = true }
forge-publisher = { workspace = true }
